<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1319">
  <title>MZ Police MDT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app" aria-hidden="true">
    <a class="skip-link" href="#content">Ir para o conteúdo</a>
    <section class="terminal" aria-label="Terminal de dados policiais">
      <aside class="sidebar">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="shield"></i></span>
          <span><strong>MZ POLICE</strong><small>TERMINAL MDT</small></span>
        </header>
        <nav id="navigation" class="navigation" aria-label="Navegação principal"></nav>
        <footer class="sidebar-footer">
          <span class="system-state"><i data-lucide="server"></i><span>CONTRATO P6</span></span>
          <button id="close-button" class="icon-button" type="button" aria-label="Fechar MDT" title="Fechar MDT">
            <i data-lucide="log-out"></i>
          </button>
        </footer>
      </aside>
      <section class="workspace">
        <header class="topbar">
          <div>
            <span id="section-kicker" class="kicker">VISÃO OPERACIONAL</span>
            <h1 id="section-title">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <span id="preview-badge" class="preview-badge" hidden>PREVIEW SEM DADOS REAIS</span>
            <button id="refresh-button" class="icon-button" type="button" aria-label="Atualizar tela" title="Atualizar tela">
              <i data-lucide="refresh-cw"></i>
            </button>
            <span class="escape-hint">ESC</span>
          </div>
        </header>
        <div id="loading-bar" class="loading-bar" hidden><span></span></div>
        <section id="content" class="content" aria-live="polite"></section>
      </section>
    </section>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script src="lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
